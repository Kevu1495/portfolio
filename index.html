<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kevin Patel | Portfolio & Resume</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 2rem 1rem; }
    .container { max-width: 900px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
    h1 { font-size: 1.5rem; }
    .btn-group { display: flex; gap: 0.75rem; }
    .btn { display: inline-block; padding: 0.5rem 1rem; border-radius: 6px; text-decoration: none; font-size: 0.9rem; font-weight: 500; }
    .btn-outline { border: 1px solid #334155; color: #94a3b8; }
    .btn-primary { background-color: #2563eb; color: #fff; border: 1px solid #2563eb; }
    .viewer-container { width: 100%; height: 85vh; border: 1px solid #334155; border-radius: 8px; overflow: hidden; background: #1e293b; }
    object { width: 100%; height: 100%; }
    @media (max-width: 768px) {
      .viewer-container { display: none; }
      .mobile-fallback { display: block; padding: 2rem; text-align: center; border: 1px dashed #334155; border-radius: 8px; margin-top: 1rem; }
    }
    @media (min-width: 769px) {
      .mobile-fallback { display: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Kevin Patel</h1>
      <div class="btn-group">
        <a href="./resume.pdf" target="_blank" class="btn btn-outline">Open in New Tab</a>
        <a href="./resume.pdf" download="Kevin_Patel_Resume.pdf" class="btn btn-primary">Download PDF</a>
      </div>
    </header>

    <div class="viewer-container">
      <object data="./resume.pdf" type="application/pdf">
        <p>Your browser does not support inline PDF viewing. <a href="./resume.pdf" download style="color: #60a5fa;">Download the PDF</a> instead.</p>
      </object>
    </div>

    <div class="mobile-fallback">
      <p>Mobile browsers do not display embedded PDF viewers directly.</p>
      <a href="./resume.pdf" target="_blank" class="btn btn-primary" style="margin-top: 1rem;">View Resume PDF</a>
    </div>
  </div>
</body>
</html>
